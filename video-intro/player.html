<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#FCFCFB;}
  canvas{display:block;width:1920px;height:1080px;}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
window.SCENES = [];
// 场景文件按顺序挂载：Claude 加新场景时在此加一行 script 标签即可
</script>
<script src="scenes/scene0.js"></script>
<script src="scenes/scene1.js"></script>
<script src="scenes/scene2.js"></script>
<script src="scenes/scene3.js"></script>
<script src="scenes/scene4.js"></script>
<script>
// 全局时间 -> 场景内时间的纯函数分发
window.renderAt = function(timeSec) {
  var scenes = window.SCENES.filter(Boolean);
  if (!scenes.length) return { scene: -1 };
  var acc = 0, idx = scenes.length - 1, local = 0;
  for (var i = 0; i < scenes.length; i++) {
    var d = scenes[i].durationMs / 1000;
    if (timeSec < acc + d || i === scenes.length - 1) {
      idx = i; local = Math.min(Math.max(timeSec - acc, 0), d);
      break;
    }
    acc += d;
  }
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  scenes[idx].draw(ctx, canvas.width, canvas.height, local);
  return { scene: idx, tLocal: local };
};
window.totalDurationSec = function() {
  return window.SCENES.filter(Boolean).reduce(function(s, sc){ return s + sc.durationMs / 1000; }, 0);
};
</script>
</body>
</html>
